name: Refresh homepage stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # STATS_TOKEN: a fine-grained token for sarthaknimbalkar with read access to
      # metadata on all repos (user + Vervelio-Labs), so private contributions count.
      - run: python scripts/build_stats.py data/stats.json
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/stats.json
          git diff --cached --quiet || git commit -m "Refresh homepage stats"
          git push
